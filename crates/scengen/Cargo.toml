[package]
name = "scengen"
version.workspace = true
edition.workspace = true
license.workspace = true

# ISOLATED from the critical `extractor` binary on purpose: a compile/deploy fault in the
# (non-critical) scenario subsystem must never block the dispatch/dashboard extraction.
# Shares only tt-core types + the remote-toolbox-sql script (which serializes Oracle access).
[[bin]]
name = "scengen"
path = "src/main.rs"

[dependencies]
tt-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
